spring.application.name=skill-verification
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skill_verification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Upload directory configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Integration Mode (MOCK or REAL)
app.integration.mode=${INTEGRATION_MODE:MOCK}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:this-is-a-placeholder-secret-key-that-should-be-changed-in-production-this-is-a-placeholder-secret-key-that-should-be-changed-in-production}
app.jwt.expiration-ms=86400000

# ONEST / Beckn Configuration
onest.enabled=${ONEST_ENABLED:false}
onest.base-url=${ONEST_BASE_URL:}
onest.subscriber-id=${ONEST_SUBSCRIBER_ID:}
onest.subscriber-uri=${ONEST_SUBSCRIBER_URI:}
onest.registry-url=${ONEST_REGISTRY_URL:}

beckn.bap-id=${BECKN_BAP_ID:}
beckn.bap-uri=${BECKN_BAP_URI:}
beckn.private-key=${BECKN_PRIVATE_KEY:}
beckn.public-key=${BECKN_PUBLIC_KEY:}
