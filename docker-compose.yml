version: '3.8'

services:
  # ==========================================
  # Database Service (MySQL 8)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: beckn-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-skill_verification}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - beckn-net

  # ==========================================
  # Backend BAP Service (Spring Boot)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beckn-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-skill_verification}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-production-super-secret-key-change-this-in-production-must-be-256-bits-long}
      INTEGRATION_MODE: ${INTEGRATION_MODE:-REAL}
      ONEST_ENABLED: "true"
      ONEST_BASE_URL: ${ONEST_BASE_URL:-http://backend:8081/api/bpp}
      ONEST_SUBSCRIBER_ID: ${ONEST_SUBSCRIBER_ID:-skill-verification-bap.onest.network}
      ONEST_SUBSCRIBER_URI: ${ONEST_SUBSCRIBER_URI:-http://backend:8081/api/beckn}
      BECKN_DOMAIN: onest:work-opportunities
      BECKN_GATEWAY_URL: ${BECKN_GATEWAY_URL:-http://backend:8081/api/bpp}
      BECKN_BAP_ID: ${BECKN_BAP_ID:-skill-verification-bap.onest.network}
      BECKN_BAP_URI: ${BECKN_BAP_URI:-http://backend:8081/api/beckn}
      BECKN_KEY_ID: key-1
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8081:8081"
    networks:
      - beckn-net

  # ==========================================
  # Frontend Client Service (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beckn-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - beckn-net

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  beckn-net:
    driver: bridge

